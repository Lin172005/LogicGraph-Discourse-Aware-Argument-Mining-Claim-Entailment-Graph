services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: logicgraph-neo4j
    ports:
      - "7474:7474" # Web HTTP Console
      - "7687:7687" # Bolt protocol (driver connection)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=apoc
      # Production settings
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_default__listen__address=0.0.0.0
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - logicgraph

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logicgraph-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__ # Exclude pycache from mount
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - GEMINI_MODEL=gemini-3.8-flash
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - logicgraph
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local

networks:
  logicgraph:
    driver: bridge
